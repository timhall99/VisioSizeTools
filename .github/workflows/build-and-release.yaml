name: Build & Package VisioSizeTools (Inno Setup) and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: VisioSizeTools
  SOLUTION: VisioSizeTools.sln
  ISS: installer/VisioSizeTools.iss
  BUILD_OUTPUT: src/VisioSizeTools/bin/Release/net48
  DOTNET_VERSION: "8.x"

jobs:
  build-package-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Get all commit messages since last version tag
        id: commit
        shell: bash
        run: |
          git fetch --tags --force --prune
          LAST_VERSION_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || true)
          if [ -z "$LAST_VERSION_TAG" ]; then
            COMMIT_MESSAGES=$(git log --pretty=format:"%h %s%n%b" HEAD)
          else
            COMMIT_MESSAGES=$(git log --pretty=format:"%h %s%n%b" "${LAST_VERSION_TAG}..HEAD")
          fi
          if [ -z "$COMMIT_MESSAGES" ]; then
            COMMIT_MESSAGES="No commits since the previous version tag (${LAST_VERSION_TAG})."
          fi
          {
            echo "commit_messages<<EOF"
            echo "$COMMIT_MESSAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Auto-compute next SemVer from commit messages; create vX.Y.Z tag
      - name: Compute next version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune
          LAST=$(git tag -l "v*" --sort=-v:refname | head -n1 || true)
          if [ -z "$LAST" ]; then RAW="0.0.0"; BASE=""; else RAW="${LAST#v}"; BASE="$LAST.."; fi
          COMMITS=$(git log --pretty=%s ${BASE}HEAD -- . || true)
          bump="patch"
          if grep -qiE 'BREAKING CHANGE|!: ' <<<"$COMMITS" ; then bump="major"
          elif grep -qiE '^feat(\(|:)|^feature' <<<"$COMMITS" ; then bump="minor"
          elif grep -qiE '^fix(\(|:)' <<<"$COMMITS" ; then bump="patch"; fi
          IFS=. read -r MA MI PA <<<"$RAW"
          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            patch) PA=$((PA+1));;
          esac
          NEXT="${MA}.${MI}.${PA}"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"  >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore -p:Version=${{ steps.ver.outputs.next }}

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC /Qp `
            "/DAppVersion=${{ steps.ver.outputs.next }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\$($env:BUILD_OUTPUT -replace '/', '\')" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts" `
            $env:ISS
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-artifacts
          path: artifacts/*.exe
          overwrite: true

      # Everything below only runs for pushes to main (not PRs)
      - name: Create & push tag
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping."
          else
            git tag -a "${TAG}" -m "Auto-release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: artifacts/*.exe
          body: |
            Automated release for ${{ steps.ver.outputs.tag }}.

            ### Commit Messages
            ```
            ${{ steps.commit.outputs.commit_messages }}
            ```

            ---

            **Package Details**
            - Inno Setup installer: per-user install (no admin rights), registers the COM add-in under HKCU
            - Works with 32- and 64-bit Visio (Office 2013 or later); requires .NET Framework 4.8
            - Restart Visio after installing
